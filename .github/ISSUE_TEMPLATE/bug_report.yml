name: Bug report
description: Report a reproducible bug.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting this bug. Please provide enough detail to reproduce it quickly.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What is wrong?
      placeholder: Short bug description
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: List exact steps to trigger the bug.
      placeholder: |
        1. Go to ...
        2. Tap on ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
      description: What should happen instead?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
      description: What happened?
    validations:
      required: true
  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options:
        - Critical (blocks release)
        - High
        - Medium
        - Low
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Platform
      description: Device/OS/app version if relevant.
      placeholder: Android 14, iOS 18, Expo Go 54
