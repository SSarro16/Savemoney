name: Add New Items To Project

on:
  issues:
    types:
      - opened
      - reopened
  pull_request:
    types:
      - opened
      - reopened

jobs:
  add-to-project:
    runs-on: ubuntu-latest
    steps:
      - name: Check configuration
        id: config
        run: |
          if [ -n "${{ vars.GH_PROJECT_URL }}" ] && [ -n "${{ secrets.ADD_TO_PROJECT_PAT }}" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Add issue or PR to project
        if: ${{ steps.config.outputs.configured == 'true' }}
        uses: actions/add-to-project@v1.0.2
        with:
          project-url: ${{ vars.GH_PROJECT_URL }}
          github-token: ${{ secrets.ADD_TO_PROJECT_PAT }}

      - name: Warn about missing project automation setup
        if: ${{ steps.config.outputs.configured != 'true' }}
        run: |
          echo "::warning::Project automation disabled. Set repository variable GH_PROJECT_URL and secret ADD_TO_PROJECT_PAT."
